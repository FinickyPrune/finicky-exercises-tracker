included:
  - ExercisesTracker
  - ExercisesTrackerTests

# Formatting rules are owned by SwiftFormat.
disabled_rules:
  - trailing_comma
  - opening_brace

opt_in_rules:
  - closure_spacing
  - contains_over_first_not_nil
  - empty_count
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - private_swiftui_state
  - redundant_nil_coalescing
  - toggle_bool

line_length:
  warning: 120
  ignores_comments: true

identifier_name:
  excluded: [id, x, y]
