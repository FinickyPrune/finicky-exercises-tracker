name: ExercisesTracker

options:
  bundleIdPrefix: com.finickyprune
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Automatic

targets:
  ExercisesTracker:
    type: application
    platform: iOS
    sources:
      - ExercisesTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.finickyprune.exercisestracker
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Exercises
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets:
        - ExercisesTrackerTests
      gatherCoverageData: true

  ExercisesTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ExercisesTrackerTests
    dependencies:
      - target: ExercisesTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.finickyprune.exercisestracker.tests
        GENERATE_INFOPLIST_FILE: YES
