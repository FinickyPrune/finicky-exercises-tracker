name: CI

# macOS minutes are billed 10x on private repos, so run only for PRs (and manually).
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep iPhone | head -5

      - name: Install tools
        run: make bootstrap

      - name: Format check
        run: make format-check

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: .build/DerivedData/Logs/Test/*.xcresult
          retention-days: 7
